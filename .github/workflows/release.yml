name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check tag matches manifest version
        run: test "v$(jq -r .version extension/manifest.json)" = "$GITHUB_REF_NAME"

      - name: zip for chrome
        run: cd extension && zip -r "../sidequest-$GITHUB_REF_NAME.zip" .

      - name: release
        run: gh release create "$GITHUB_REF_NAME" "sidequest-$GITHUB_REF_NAME.zip" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
